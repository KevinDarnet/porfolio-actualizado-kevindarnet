<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Minimalist Dark Rounded Container with Subtle/Light Border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="#121212" stroke="#E5E5E5" stroke-width="1.5" />
  
  <!-- Terminal Prompt '>' Symbol -->
  <polyline points="8.5,10.5 14.5,16 8.5,21.5" stroke="#F5F5F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Prompt '_' Horizontal Cursor -->
  <line x1="17" y1="21.5" x2="23.5" y2="21.5" stroke="#F5F5F5" stroke-width="2.5" stroke-linecap="round" />
</svg>
